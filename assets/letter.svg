<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2000" viewBox="0 0 1600 2000">
<rect width="1600" height="2000" fill="#ddd0b4"/>
<text x="95" y="145" font-family="SimSun,Microsoft YaHei,serif" font-size="60" fill="#34322c">秀琴给家里的一封信</text>
<text x="95" y="220" font-family="SimSun,Microsoft YaHei,serif" font-size="32" fill="#34322c">2009年7月17日</text>
<path d="M95 270 H1505" stroke="#777063" stroke-width="2"/>
<text x="105" y="365" font-family="SimSun,Microsoft YaHei,serif" font-size="38" fill="#34322c">遥遥那件雨衣我拆了一回，袖口缝歪了。</text>
<text x="105" y="469" font-family="SimSun,Microsoft YaHei,serif" font-size="38" fill="#34322c">拿蓝线补好，放在床头，线头还没剪。</text>
<text x="105" y="573" font-family="SimSun,Microsoft YaHei,serif" font-size="38" fill="#34322c">你下次别买那么多零食，柜子里还有。</text>
<text x="105" y="677" font-family="SimSun,Microsoft YaHei,serif" font-size="38" fill="#34322c">她问我什么时候去学校，我又说忙完再去。</text>
<text x="105" y="781" font-family="SimSun,Microsoft YaHei,serif" font-size="38" fill="#34322c">柜子底下垫好了，工钱回来再算。</text>
<text x="105" y="885" font-family="SimSun,Microsoft YaHei,serif" font-size="38" fill="#34322c">玉枝说河水涨，明天把东西收高些。</text>
<text x="105" y="989" font-family="SimSun,Microsoft YaHei,serif" font-size="38" fill="#34322c">回来记得带把能剪布的剪刀。</text>
<text x="100" y="1860" font-family="SimSun,Microsoft YaHei,serif" font-size="26" fill="#34322c">虚构作品原件排版 · 对应页面提供完整转录</text>
</svg>