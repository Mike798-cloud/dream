<text x="95" y="145" font-family="SimSun,Microsoft YaHei,serif" font-size="60" fill="#34322c">未完成归还的旁页</text>
<text x="95" y="220" font-family="SimSun,Microsoft YaHei,serif" font-size="32" fill="#34322c">私人记录 · 2016年2月</text>
<path d="M95 270 H1505" stroke="#777063" stroke-width="2"/>
<text x="105" y="365" font-family="SimSun,Microsoft YaHei,serif" font-size="38" fill="#34322c">原床位在核对以前被移走。</text>
<text x="105" y="469" font-family="SimSun,Microsoft YaHei,serif" font-size="38" fill="#34322c">当事人后来无法再次回应。</text>
<text x="105" y="573" font-family="SimSun,Microsoft YaHei,serif" font-size="38" fill="#34322c">账上借用身体姓名仍在，归还栏未填写。</text>
<text x="105" y="677" font-family="SimSun,Microsoft YaHei,serif" font-size="38" fill="#34322c">旁注：先找回来，不能按空床处理。</text>
<text x="105" y="781" font-family="SimSun,Microsoft YaHei,serif" font-size="38" fill="#34322c">成功案例：活人先取回，死者联系后撤。</text>
<text x="105" y="885" font-family="SimSun,Microsoft YaHei,serif" font-size="38" fill="#34322c">现实原件仍应保留；不以毁床替代善后。</text>
<text x="100" y="1860" font-family="SimSun,Microsoft YaHei,serif" font-size="26" fill="#34322c">虚构作品原件排版 · 对应页面提供完整转录</text>
