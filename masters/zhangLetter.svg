<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2000" viewBox="0 0 1600 2000">
<rect width="1600" height="2000" fill="#ddd0b4"/>
<text x="95" y="145" font-family="SimSun,Microsoft YaHei,serif" font-size="60" fill="#34322c">张岚留存的经历书信</text>
<text x="95" y="220" font-family="SimSun,Microsoft YaHei,serif" font-size="32" fill="#34322c">2012年8月后记 / 2026年授权</text>
<path d="M95 270 H1505" stroke="#777063" stroke-width="2"/>
<text x="105" y="365" font-family="SimSun,Microsoft YaHei,serif" font-size="38" fill="#34322c">校门口照片里的身体是我的，那天去的人不是我。</text>
<text x="105" y="469" font-family="SimSun,Microsoft YaHei,serif" font-size="38" fill="#34322c">8月12日入睡后，留在B-0306那一端。</text>
<text x="105" y="573" font-family="SimSun,Microsoft YaHei,serif" font-size="38" fill="#34322c">13日有人带我的相机去了学校。</text>
<text x="105" y="677" font-family="SimSun,Microsoft YaHei,serif" font-size="38" fill="#34322c">她说只出去看一眼，第三晚才回来。</text>
<text x="105" y="781" font-family="SimSun,Microsoft YaHei,serif" font-size="38" fill="#34322c">15日夜里回位，我辨认自己的身体后恢复。</text>
<text x="105" y="885" font-family="SimSun,Microsoft YaHei,serif" font-size="38" fill="#34322c">醒后坐到天亮，不敢再躺下。</text>
<text x="105" y="989" font-family="SimSun,Microsoft YaHei,serif" font-size="38" fill="#34322c">她归还了，可我不能把三个晚上忘掉。</text>
<text x="100" y="1860" font-family="SimSun,Microsoft YaHei,serif" font-size="26" fill="#34322c">虚构作品原件排版 · 对应页面提供完整转录</text>
</svg>